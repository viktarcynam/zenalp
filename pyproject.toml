[tool.poetry]
name = "trade1"
version = "0.1.0"
description = "A CLI for trading options using Alpaca API."
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.9"
alpaca-py = "^0.42.0"
click = "^8.1.3"
python-dotenv = "^0.20.0"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
trade1 = "trade1.cli:main"
